name: Main Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: maven
      - name: Maven Build
        # Only core is built: it holds all the code. Platform artifacts are produced
        # by the release workflow when a tag is pushed.
        run: mvn -B -pl core -am install
